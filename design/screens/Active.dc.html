<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Active workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7FA6FF}a:hover{color:#A9C2FF}
input::placeholder{color:#8B94A3}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B0D10; color: #F4F6F8; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">

<div style="box-sizing: border-box; padding: 56px 16px 0; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<a href="Home.dc.html" aria-label="Minimize workout" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #F4F6F8"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column; align-items: center"><span style="font-size: 17px; font-weight: 600">Push day</span><span style="font-size: 13px; color: #A3ACB9; font-variant-numeric: tabular-nums">42:18</span></div>
<a href="Summary.dc.html" style="height: 44px; padding: 0 18px; box-sizing: border-box; border-radius: 12px; background: #2B64F0; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; text-decoration: none">Finish</a>
</header>

<section aria-label="Rest timer" style="background: #14171C; border: 1px solid #262B33; border-radius: 16px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="RestTimer.dc.html" aria-label="Rest 1 minute 12 seconds left. Open rest timer" style="display: flex; align-items: baseline; gap: 8px; min-height: 44px; text-decoration: none; color: #F4F6F8"><span style="font-size: 13px; color: #A3ACB9">Rest</span><span style="font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums">01:12</span></a>
<div style="display: flex; gap: 6px">
<button style="min-width: 52px; height: 44px; border-radius: 12px; background: #1B1F26; border: 1px solid #262B33; color: #F4F6F8; font-size: 15px; font-weight: 600; font-family: inherit">−15</button>
<button style="min-width: 52px; height: 44px; border-radius: 12px; background: #1B1F26; border: 1px solid #262B33; color: #F4F6F8; font-size: 15px; font-weight: 600; font-family: inherit">+15</button>
<button style="min-width: 60px; height: 44px; border-radius: 12px; background: rgba(43,100,240,0.2); border: none; color: #7FA6FF; font-size: 15px; font-weight: 600; font-family: inherit">Skip</button>
</div>
</div>
<div style="height: 4px; border-radius: 2px; background: #262B33"><div style="width: 40%; height: 4px; border-radius: 2px; background: #7FA6FF"></div></div>
</section>

<section aria-label="Bench press" style="background: #14171C; border: 1px solid #262B33; border-radius: 16px; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600; color: #7FA6FF">Bench press</span><span style="font-size: 13px; color: #A3ACB9">Barbell · chest</span></div>
<button aria-label="Exercise options" style="width: 44px; height: 44px; margin-right: -10px; background: none; border: none; color: #A3ACB9; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</div>
<span style="align-self: flex-start; height: 28px; padding: 0 12px 0 8px; border-radius: 999px; background: rgba(43,100,240,0.18); color: #7FA6FF; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>Try 42.5 kg × 8–10 · you hit 10 reps last time</span>
<div style="display: grid; grid-template-columns: 32px 1fr 64px 56px 44px; gap: 8px; font-size: 12px; font-weight: 600; color: #A3ACB9; text-transform: uppercase; letter-spacing: 0.5px; padding: 0 6px"><span>Set</span><span>Previous</span><span style="text-align: center">kg</span><span style="text-align: center">Reps</span><span></span></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{sets}}" as="s" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 32px 1fr 64px 56px 44px; gap: 8px; align-items: center; min-height: 48px; padding: 0 6px; border-radius: 12px; box-sizing: border-box; background: {{s.rowBg}}; border: {{s.rowBorder}}; font-variant-numeric: tabular-nums">
<span style="font-size: 17px; font-weight: 600">{{s.n}}</span>
<span style="font-size: 15px; color: #A3ACB9">{{s.prev}}</span>
<input value="{{s.kg}}" placeholder="–" inputmode="decimal" aria-label="Set {{s.n}} weight in kilograms" style="width: 100%; height: 36px; box-sizing: border-box; border: none; border-radius: 8px; background: {{s.inBg}}; color: #F4F6F8; text-align: center; font-size: 17px; font-weight: 600; font-family: inherit; font-variant-numeric: tabular-nums; padding: 0">
<input value="{{s.reps}}" placeholder="–" inputmode="numeric" aria-label="Set {{s.n}} repetitions" style="width: 100%; height: 36px; box-sizing: border-box; border: none; border-radius: 8px; background: {{s.inBg}}; color: #F4F6F8; text-align: center; font-size: 17px; font-weight: 600; font-family: inherit; font-variant-numeric: tabular-nums; padding: 0">
<button aria-label="Mark set {{s.n}} complete" style="width: 44px; height: 44px; background: none; border: none; display: flex; align-items: center; justify-content: center; padding: 0; margin-right: -6px">
<sc-if value="{{s.done}}" hint-placeholder-val="{{ true }}"><span style="width: 28px; height: 28px; border-radius: 8px; background: #34D399; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0D10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
<sc-if value="{{s.notDone}}" hint-placeholder-val="{{ false }}"><span style="width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid #5A6472; box-sizing: border-box"></span></sc-if>
</button>
</div>
</sc-for>
</div>
<button style="height: 44px; border-radius: 12px; background: #1B1F26; border: none; color: #F4F6F8; font-size: 15px; font-weight: 600; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add set</button>
</section>

<section aria-label="Incline dumbbell press" style="display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 10px 14px; background: #14171C; border: 1px solid #262B33; border-radius: 16px">
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 17px; font-weight: 600">Incline dumbbell press</span><span style="font-size: 13px; color: #A3ACB9">Next · 3 sets · 0 done</span></div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B94A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</section>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; box-sizing: border-box; padding: 12px 16px 28px; display: flex; align-items: center; gap: 12px; background: #0F1217; border-top: 1px solid #232831">
<a href="Voice.dc.html" aria-label="Log a set by voice" style="width: 56px; height: 56px; border-radius: 28px; background: #2B64F0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3ZM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></a>
<a href="AddExercise.dc.html" style="flex: 1; height: 52px; box-sizing: border-box; border-radius: 14px; background: #14171C; border: 1px solid #262B33; color: #F4F6F8; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Add exercise</a>
<button style="min-width: 80px; height: 52px; background: none; border: none; color: #F2545B; font-size: 15px; font-weight: 600; font-family: inherit">Cancel</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sets = [
{ n: 1, prev: '40 × 10', kg: '42.5', reps: '10', done: true, notDone: false, rowBg: 'rgba(52,211,153,0.14)', rowBorder: '1px solid transparent', inBg: 'transparent' },
{ n: 2, prev: '40 × 10', kg: '42.5', reps: '10', done: true, notDone: false, rowBg: 'rgba(52,211,153,0.14)', rowBorder: '1px solid transparent', inBg: 'transparent' },
{ n: 3, prev: '40 × 10', kg: '42.5', reps: '', done: false, notDone: true, rowBg: '#1B1F26', rowBorder: '1px solid #2B64F0', inBg: '#262B33' },
{ n: 4, prev: '40 × 9', kg: '', reps: '', done: false, notDone: true, rowBg: 'transparent', rowBorder: '1px solid transparent', inBg: '#1B1F26' }
];
return { sets };
}
}
</script>


</body></html>
