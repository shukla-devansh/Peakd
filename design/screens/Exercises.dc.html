<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Exercise library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7FA6FF}a:hover{color:#A9C2FF}
input::placeholder{color:#8B94A3}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B0D10; color: #F4F6F8; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">

<div style="box-sizing: border-box; padding: 56px 16px 0; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px">Exercises</h1>
<a href="CustomExercise.dc.html" aria-label="Create custom exercise" style="width: 44px; height: 44px; border-radius: 22px; background: #14171C; border: 1px solid #262B33; color: #7FA6FF; display: flex; align-items: center; justify-content: center; padding: 0; box-sizing: border-box"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
</header>

<div style="position: relative">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B94A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 14px; top: 13px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" placeholder="Search exercises" aria-label="Search exercises" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 14px 0 42px; border-radius: 12px; border: 1px solid #262B33; background: #14171C; color: #F4F6F8; font-size: 17px; font-family: inherit">
</div>

<div role="group" aria-label="Filter by muscle group" style="display: flex; gap: 8px; overflow: hidden; margin-right: -16px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button aria-pressed="{{c.pressed}}" style="flex: none; height: 40px; padding: 0 16px; border-radius: 999px; background: {{c.bg}}; border: {{c.border}}; color: {{c.color}}; font-size: 15px; font-weight: 600; font-family: inherit">{{c.label}}</button>
</sc-for>
</div>

<section aria-label="Recent exercises" style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 4px 0 0; font-size: 13px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #A3ACB9">Recent</h2>
<sc-for list="{{recent}}" as="e" hint-placeholder-count="3">
<a href="ExerciseDetail.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 10px 14px; background: #14171C; border: 1px solid #262B33; border-radius: 12px; text-decoration: none; color: #F4F6F8">
<div style="width: 44px; height: 44px; border-radius: 10px; background: #1B1F26; display: flex; align-items: center; justify-content: center; color: #7FA6FF; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0"><span style="font-size: 17px; font-weight: 600">{{e.name}}</span><span style="font-size: 13px; color: #A3ACB9">{{e.meta}}</span></div>
<span style="font-size: 13px; color: #A3ACB9; font-variant-numeric: tabular-nums">{{e.best}}</span>
</a>
</sc-for>
</section>

<section aria-label="All exercises" style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 4px 0 0; font-size: 13px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #A3ACB9">A to Z</h2>
<sc-for list="{{all}}" as="e" hint-placeholder-count="3">
<a href="ExerciseDetail.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 10px 14px; background: #14171C; border: 1px solid #262B33; border-radius: 12px; text-decoration: none; color: #F4F6F8">
<div style="width: 44px; height: 44px; border-radius: 10px; background: #1B1F26; display: flex; align-items: center; justify-content: center; color: #7FA6FF; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0"><span style="font-size: 17px; font-weight: 600">{{e.name}}</span><span style="font-size: 13px; color: #A3ACB9">{{e.meta}}</span></div>
</a>
</sc-for>
</section>

</div>

<nav aria-label="Main tabs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 26px; display: flex; background: #0F1217; border-top: 1px solid #232831">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="flex: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{t.color}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg><span>{{t.label}}</span></a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const ACTIVE = 2;
const tabs = [
{ label: 'Home', href: 'Home.dc.html', d: 'M3 11.5 12 4l9 7.5M5 10v10h5v-6h4v6h5V10' },
{ label: 'Workout', href: 'Start.dc.html', d: 'M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11' },
{ label: 'Exercises', href: 'Exercises.dc.html', d: 'M4 6h16M4 12h16M4 18h10' },
{ label: 'Progress', href: 'Progress.dc.html', d: 'M4 19V9M10 19V5M16 19v-8M3 21h18' },
{ label: 'Profile', href: 'Profile.dc.html', d: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-8 9c0-4 3.6-6 8-6s8 2 8 6' }
].map((t, i) => ({ ...t, color: i === ACTIVE ? '#7FA6FF' : '#8B94A3' }));
const labels = ['All', 'Chest', 'Back', 'Legs', 'Shoulders', 'Arms', 'Core'];
const chips = labels.map((label, i) => ({
label,
pressed: i === 0 ? 'true' : 'false',
bg: i === 0 ? '#2B64F0' : '#14171C',
border: i === 0 ? '1px solid #2B64F0' : '1px solid #262B33',
color: i === 0 ? '#FFFFFF' : '#A3ACB9'
}));
const recent = [
{ name: 'Bench press', meta: 'Chest · Barbell', best: '45 kg × 8' },
{ name: 'Incline dumbbell press', meta: 'Chest · Dumbbell', best: '22 kg × 10' },
{ name: 'Barbell row', meta: 'Back · Barbell', best: '57.5 kg × 8' }
];
const all = [
{ name: 'Arnold press', meta: 'Shoulders · Dumbbell' },
{ name: 'Back squat', meta: 'Legs · Barbell' },
{ name: 'Cable crossover', meta: 'Chest · Cable' }
];
return { tabs, chips, recent, all };
}
}
</script>


</body></html>
