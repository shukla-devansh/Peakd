<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7FA6FF}a:hover{color:#A9C2FF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B0D10; color: #F4F6F8; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">

<div style="box-sizing: border-box; padding: 56px 16px 0; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #A3ACB9">Wednesday, 11 November</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.4px">Good afternoon</h1>
</div>
<button aria-label="Profile and settings" style="width: 44px; height: 44px; border-radius: 22px; background: #14171C; border: 1px solid #262B33; color: #F4F6F8; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-8 9c0-4 3.6-6 8-6s8 2 8 6"></path></svg></button>
</header>

<section aria-label="Suggested workout" style="background: #14171C; border: 1px solid #262B33; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span style="align-self: flex-start; height: 28px; padding: 0 12px 0 8px; border-radius: 999px; background: rgba(43,100,240,0.18); color: #7FA6FF; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>Suggested for today</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 22px; font-weight: 700">Push day</h2>
<span style="font-size: 15px; color: #A3ACB9">5 exercises · about 55 min</span>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.4; color: #A3ACB9">Legs was yesterday and chest has your lowest volume this week.</p>
<div style="display: flex; gap: 8px; margin-top: 2px">
<a href="Active.dc.html" style="flex: 1; height: 48px; border-radius: 14px; background: #2B64F0; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Start workout</a>
<a href="NextSession.dc.html" style="width: 104px; height: 48px; border-radius: 14px; background: #1B1F26; border: 1px solid #262B33; color: #F4F6F8; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box">Edit plan</a>
</div>
</section>

<div style="display: flex; gap: 10px">
<a href="Fatigue.dc.html" style="flex: 1; min-width: 0; box-sizing: border-box; background: #14171C; border: 1px solid #262B33; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #F4F6F8">
<div style="position: relative; width: 60px; height: 60px; flex: none">
<svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true" style="transform: rotate(-90deg)"><circle cx="30" cy="30" r="25" fill="none" stroke="#262B33" stroke-width="6"></circle><circle cx="30" cy="30" r="25" fill="none" stroke="#F5A524" stroke-width="6" stroke-linecap="round" stroke-dasharray="97.4 157.1"></circle></svg>
<span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums">62</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 13px; color: #A3ACB9">Fatigue</span><span style="font-size: 17px; font-weight: 700; color: #F5A524">Moderate</span></div>
</a>
<div style="flex: 1; min-width: 0; box-sizing: border-box; background: #14171C; border: 1px solid #262B33; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 13px; color: #A3ACB9">This week</span><span style="font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums">2 of 4</span></div>
<div role="img" aria-label="Trained Monday and Tuesday. Today is Wednesday. Thursday to Sunday not yet." style="display: flex; justify-content: space-between">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><div style="width: 16px; height: 16px; border-radius: 8px; box-sizing: border-box; background: {{d.fill}}; border: {{d.border}}"></div><span style="font-size: 12px; color: #A3ACB9">{{d.label}}</span></div>
</sc-for>
</div>
</div>
</div>

<section aria-label="Recent workouts" style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Recent</h2>
<a href="History.dc.html" style="font-size: 15px; font-weight: 500; text-decoration: none; min-height: 44px; display: flex; align-items: center">See all</a>
</div>
<sc-for list="{{recent}}" as="r" hint-placeholder-count="2">
<a href="Summary.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 10px 14px; background: #14171C; border: 1px solid #262B33; border-radius: 12px; text-decoration: none; color: #F4F6F8">
<div style="width: 40px; height: 40px; border-radius: 10px; background: #1B1F26; display: flex; align-items: center; justify-content: center; color: #7FA6FF; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0"><span style="font-size: 17px; font-weight: 600">{{r.name}}</span><span style="font-size: 13px; color: #A3ACB9">{{r.meta}}</span></div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B94A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</sc-for>
</section>

</div>

<nav aria-label="Main tabs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 26px; display: flex; background: #0F1217; border-top: 1px solid #232831">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="flex: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{t.color}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg><span>{{t.label}}</span></a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const ACTIVE = 0;
const tabs = [
{ label: 'Home', href: 'Home.dc.html', d: 'M3 11.5 12 4l9 7.5M5 10v10h5v-6h4v6h5V10' },
{ label: 'Workout', href: 'Start.dc.html', d: 'M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11' },
{ label: 'Exercises', href: 'Exercises.dc.html', d: 'M4 6h16M4 12h16M4 18h10' },
{ label: 'Progress', href: 'Progress.dc.html', d: 'M4 19V9M10 19V5M16 19v-8M3 21h18' },
{ label: 'Profile', href: 'Profile.dc.html', d: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-8 9c0-4 3.6-6 8-6s8 2 8 6' }
].map((t, i) => ({ ...t, color: i === ACTIVE ? '#7FA6FF' : '#8B94A3' }));
const letters = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
const week = letters.map((label, i) => ({
label,
fill: i < 2 ? '#2B64F0' : 'transparent',
border: i === 2 ? '2px solid #7FA6FF' : (i < 2 ? 'none' : '1.5px solid #3A414D')
}));
const recent = [
{ name: 'Legs', meta: 'Tue · 64 min · 18,920 kg' },
{ name: 'Upper body', meta: 'Mon · 52 min · 11,640 kg' }
];
return { tabs, week, recent };
}
}
</script>


</body></html>
