<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Permissions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7FA6FF}a:hover{color:#A9C2FF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B0D10; color: #F4F6F8; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">

<div style="box-sizing: border-box; padding: 56px 16px 0; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px">
<a href="Equipment.dc.html" aria-label="Back to equipment" style="width: 44px; height: 44px; margin: -10px 0 -10px -12px; display: flex; align-items: center; justify-content: center; color: #F4F6F8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div role="progressbar" aria-label="Setup progress, step 3 of 3" aria-valuemin="1" aria-valuemax="3" aria-valuenow="3" style="flex: 1; display: flex; gap: 6px">
<div style="flex: 1; height: 4px; border-radius: 2px; background: #7FA6FF"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #7FA6FF"></div>
<div style="flex: 1; height: 4px; border-radius: 2px; background: #7FA6FF"></div>
</div>
</div>
<span style="font-size: 13px; color: #A3ACB9">Step 3 of 3</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.4px">Turn on what you need</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.4; color: #A3ACB9">Each one is optional. The app works without them, with fewer features.</p>
</div>

<section aria-label="Permissions" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{perms}}" as="p" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; min-height: 76px; box-sizing: border-box; padding: 12px 14px; background: #14171C; border: 1px solid #262B33; border-radius: 16px">
<div style="width: 40px; height: 40px; border-radius: 10px; background: #1B1F26; color: #7FA6FF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0"><span style="font-size: 17px; font-weight: 600">{{p.title}}</span><span style="font-size: 13px; line-height: 1.35; color: #A3ACB9">{{p.why}}</span></div>
<sc-if value="{{p.on}}" hint-placeholder-val="{{ false }}">
<span style="height: 36px; padding: 0 10px 0 8px; border-radius: 999px; background: rgba(52,211,153,0.14); color: #34D399; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>On</span>
</sc-if>
<sc-if value="{{p.off}}" hint-placeholder-val="{{ true }}">
<button onClick="{{p.allow}}" aria-label="Allow {{p.title}}" style="height: 44px; padding: 0 16px; border-radius: 12px; background: rgba(43,100,240,0.2); border: none; color: #7FA6FF; font-size: 15px; font-weight: 600; font-family: inherit; flex: none; cursor: pointer">Allow</button>
</sc-if>
</div>
</sc-for>
</section>

<p style="margin: 0; font-size: 13px; line-height: 1.45; color: #A3ACB9">Speech is turned into text on your iPhone where supported. Only the numbers you confirm, like weight and reps, are saved.</p>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 16px 34px; background: #0B0D10">
<a href="HomeEmpty.dc.html" style="height: 52px; border-radius: 14px; background: #2B64F0; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Finish setup</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const on = (this.state && this.state.on) || { notify: true };
const list = [
{ id: 'voice', title: 'Microphone and speech', why: 'Log a set by saying “45 kilos for 8 reps”.', icon: 'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3ZM5 11a7 7 0 0 0 14 0M12 18v3' },
{ id: 'health', title: 'Apple Health', why: 'Heart rate and energy in summaries; saves workouts to Health.', icon: 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z' },
{ id: 'notify', title: 'Notifications', why: 'Tells you when rest is over, even when the phone is locked.', icon: 'M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16ZM10 21h4' },
{ id: 'watch', title: 'Apple Watch', why: 'See your set and rest timer on your wrist. Needs the Watch app.', icon: 'M8 7V3h8v4M8 17v4h8v-4M7 7h10a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z' }
];
const perms = list.map((p) => ({ ...p, on: !!on[p.id], off: !on[p.id], allow: () => this.setState({ on: { ...on, [p.id]: true } }) }));
return { perms };
}
}
</script>
</body>
</html>
