<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Start workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7FA6FF}a:hover{color:#A9C2FF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B0D10; color: #F4F6F8; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">

<div style="box-sizing: border-box; padding: 56px 16px 0; display: flex; flex-direction: column; gap: 14px">

<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px">Workout</h1>

<section aria-label="Quick start" style="display: flex; flex-direction: column; gap: 10px">
<a href="Active.dc.html" style="height: 52px; border-radius: 14px; background: #2B64F0; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Start empty workout</a>

<a href="NextSession.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 10px 14px; background: rgba(43,100,240,0.12); border: 1px solid rgba(127,166,255,0.35); border-radius: 14px; text-decoration: none; color: #F4F6F8">
<div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(43,100,240,0.22); display: flex; align-items: center; justify-content: center; color: #7FA6FF; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0"><span style="font-size: 17px; font-weight: 600">Suggested: Push day</span><span style="font-size: 13px; color: #A3ACB9">Planned from your last four sessions</span></div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B94A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</section>

<section aria-label="Routines" style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 22px; font-weight: 700">Routines</h2>
<a href="RoutineEditor.dc.html" style="min-height: 44px; padding: 0 4px; background: none; border: none; color: #7FA6FF; font-size: 17px; font-weight: 500; font-family: inherit; display: flex; align-items: center; gap: 4px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New</a>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{routines}}" as="r" hint-placeholder-count="4">
<div style="box-sizing: border-box; background: #14171C; border: 1px solid #262B33; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-height: 158px">
<div style="display: flex; align-items: flex-start; justify-content: space-between">
<a href="Active.dc.html" style="font-size: 17px; font-weight: 600; color: #F4F6F8; text-decoration: none; padding-top: 2px">{{r.name}}</a>
<button aria-label="More options for {{r.name}}" style="width: 44px; height: 44px; margin: -12px -12px 0 0; background: none; border: none; color: #A3ACB9; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
</div>
<span style="font-size: 13px; line-height: 1.5; color: #A3ACB9; white-space: pre-line">{{r.lines}}</span>
<span style="font-size: 12px; color: #A3ACB9; margin-top: auto">{{r.last}}</span>
</div>
</sc-for>
</div>
</section>

</div>

<nav aria-label="Main tabs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 26px; display: flex; background: #0F1217; border-top: 1px solid #232831">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" style="flex: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{t.color}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg><span>{{t.label}}</span></a>
</sc-for>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const ACTIVE = 1;
const tabs = [
{ label: 'Home', href: 'Home.dc.html', d: 'M3 11.5 12 4l9 7.5M5 10v10h5v-6h4v6h5V10' },
{ label: 'Workout', href: 'Start.dc.html', d: 'M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11' },
{ label: 'Exercises', href: 'Exercises.dc.html', d: 'M4 6h16M4 12h16M4 18h10' },
{ label: 'Progress', href: 'Progress.dc.html', d: 'M4 19V9M10 19V5M16 19v-8M3 21h18' },
{ label: 'Profile', href: 'Profile.dc.html', d: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-8 9c0-4 3.6-6 8-6s8 2 8 6' }
].map((t, i) => ({ ...t, color: i === ACTIVE ? '#7FA6FF' : '#8B94A3' }));
const routines = [
{ name: 'Push day', lines: 'Bench press\nIncline dumbbell press\nOverhead press\n+2 more', last: 'Last done 6 days ago' },
{ name: 'Pull day', lines: 'Barbell row\nLat pulldown\nSeated cable row\n+2 more', last: 'Last done 5 days ago' },
{ name: 'Legs', lines: 'Back squat\nRomanian deadlift\nLeg press\n+2 more', last: 'Last done yesterday' },
{ name: 'Upper body', lines: 'Incline press\nPull-up\nLateral raise\n+3 more', last: 'Last done Monday' }
];
return { tabs, routines };
}
}
</script>


</body></html>
