<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Post-workout summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7FA6FF}a:hover{color:#A9C2FF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B0D10; color: #F4F6F8; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">

<div style="box-sizing: border-box; padding: 56px 16px 0; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #A3ACB9">Push day · Wednesday, 11 November</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.4px">Workout complete</h1>
</header>

<section aria-label="Workout totals" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
<div style="box-sizing: border-box; min-height: 76px; background: #14171C; border: 1px solid #262B33; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #A3ACB9">{{t.label}}</span>
<span style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums">{{t.value}} <span style="font-size: 12px; font-weight: 500; color: #A3ACB9">{{t.unit}}</span></span>
<span style="font-size: 12px; color: {{t.subColor}}; font-weight: 600">{{t.sub}}</span>
</div>
</sc-for>
</section>

<section aria-label="Personal records" style="background: rgba(255,200,87,0.1); border: 1px solid rgba(255,200,87,0.35); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; color: #FFC857"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4ZM8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M8 20h8"></path></svg><h2 style="margin: 0; font-size: 17px; font-weight: 600">2 new records</h2></div>
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 15px">Bench press · est. 1RM</span><span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">57.0 kg</span></div>
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 15px">Overhead press · best set</span><span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">30 kg × 8</span></div>
</section>

<section aria-label="Volume by exercise" style="background: #14171C; border: 1px solid #262B33; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><h2 style="margin: 0; font-size: 17px; font-weight: 600">Volume by exercise</h2><span style="font-size: 12px; color: #A3ACB9">kg</span></div>
<sc-for list="{{bars}}" as="b" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span>{{b.name}}</span><span style="font-variant-numeric: tabular-nums; color: #A3ACB9">{{b.value}}</span></div>
<div style="height: 8px; border-radius: 4px; background: #262B33"><div style="width: {{b.pct}}%; height: 8px; border-radius: 4px; background: #7FA6FF"></div></div>
</div>
</sc-for>
</section>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; box-sizing: border-box; padding: 12px 16px 28px; display: flex; gap: 8px; background: #0F1217; border-top: 1px solid #232831">
<a href="Home.dc.html" style="width: 104px; height: 52px; border-radius: 14px; background: #1B1F26; border: 1px solid #262B33; box-sizing: border-box; color: #F4F6F8; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Done</a>
<a href="NextSession.dc.html" style="flex: 1; height: 52px; border-radius: 14px; background: #2B64F0; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>Plan next session</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const tiles = [
{ label: 'Duration', value: '58:12', unit: '', sub: '18 sets', subColor: '#A3ACB9' },
{ label: 'Volume', value: '12,480', unit: 'kg', sub: '+6% vs last', subColor: '#34D399' },
{ label: 'Reps', value: '156', unit: '', sub: '5 exercises', subColor: '#A3ACB9' },
{ label: 'Avg heart rate', value: '124', unit: 'bpm', sub: 'Apple Watch', subColor: '#A3ACB9' },
{ label: 'Peak heart rate', value: '158', unit: 'bpm', sub: 'Apple Watch', subColor: '#A3ACB9' },
{ label: 'Active energy', value: '410', unit: 'kcal', sub: 'Apple Watch', subColor: '#A3ACB9' }
];
const bars = [
{ name: 'Bench press', value: '3,825', pct: 100 },
{ name: 'Incline dumbbell press', value: '2,880', pct: 75 },
{ name: 'Overhead press', value: '2,205', pct: 58 },
{ name: 'Triceps pushdown', value: '2,040', pct: 53 },
{ name: 'Lateral raise', value: '1,530', pct: 40 }
];
return { tiles, bars };
}
}
</script>


</body></html>
