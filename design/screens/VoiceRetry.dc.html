<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice · not understood</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7FA6FF}a:hover{color:#A9C2FF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B0D10; color: #F4F6F8; font-family: -apple-system, 'SF Pro Text', Inter, system-ui, sans-serif">

<div aria-hidden="true" style="box-sizing: border-box; padding: 56px 16px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; height: 44px"><span style="font-size: 17px; font-weight: 600; margin: 0 auto">Push day</span></div>
<div style="background: #14171C; border: 1px solid #262B33; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 17px; font-weight: 600; color: #7FA6FF">Bench press</span>
<div style="height: 48px; border-radius: 12px; background: rgba(52,211,153,0.14)"></div>
<div style="height: 48px; border-radius: 12px; background: rgba(52,211,153,0.14)"></div>
<div style="height: 48px; border-radius: 12px; background: #1B1F26; border: 1px solid #2B64F0"></div>
</div>
</div>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>

<section aria-label="Voice logging, needs a check" style="position: absolute; left: 0; right: 0; bottom: 0; height: 560px; box-sizing: border-box; padding: 8px 16px 32px; background: #14171C; border-top: 1px solid #262B33; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 14px">

<div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #3A414D"></div>

<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column"><span style="font-size: 22px; font-weight: 700">Missing the reps</span><span style="font-size: 13px; color: #A3ACB9">Bench press · set 3</span></div>
<a href="Active.dc.html" aria-label="Close voice logging" style="width: 44px; height: 44px; margin-right: -8px; border-radius: 22px; background: #1B1F26; color: #F4F6F8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center">
<span style="font-size: 13px; color: #A3ACB9">What I heard</span>
<span style="font-size: 22px; font-weight: 700">“45 kilos for… <span style="color: #A3ACB9">[unclear]</span>”</span>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="min-height: 76px; box-sizing: border-box; padding: 10px 12px; border-radius: 14px; background: #1B1F26; border: 1px solid #262B33; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #A3ACB9">Weight</span><span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">45 <span style="font-size: 13px; font-weight: 500; color: #A3ACB9">kg</span></span></div>
<div style="min-height: 76px; box-sizing: border-box; padding: 10px 12px; border-radius: 14px; background: {{repsBg}}; border: {{repsBorder}}; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #A3ACB9">Reps</span><span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{repsColor}}">{{repsText}}</span><sc-if value="{{missing}}" hint-placeholder-val="{{ true }}"><span style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: #F5A524"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v5M12 16.5v.5M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path></svg>Needed</span></sc-if></div>
<div style="min-height: 76px; box-sizing: border-box; padding: 10px 12px; border-radius: 14px; background: #1B1F26; border: 1px solid #262B33; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #A3ACB9">Set</span><span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">3</span></div>
</div>

<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 13px; color: #A3ACB9">Tap the reps you did</legend>
<div role="radiogroup" aria-label="Repetitions" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{reps}}" as="r" hint-placeholder-count="6">
<button role="radio" aria-checked="{{r.checked}}" onClick="{{r.pick}}" style="height: 48px; border-radius: 12px; background: {{r.bg}}; border: {{r.border}}; color: {{r.color}}; font-size: 17px; font-weight: 600; font-family: inherit; font-variant-numeric: tabular-nums; cursor: pointer">{{r.label}}</button>
</sc-for>
</div>
</fieldset>

<div style="display: flex; gap: 8px; margin-top: auto">
<a href="Voice.dc.html" style="width: 120px; height: 52px; box-sizing: border-box; border-radius: 14px; background: #1B1F26; border: 1px solid #262B33; color: #F4F6F8; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3ZM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Say again</a>
<a href="Active.dc.html" aria-disabled="{{missingStr}}" style="flex: 1; height: 52px; border-radius: 14px; background: {{saveBg}}; color: {{saveColor}}; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Save set</a>
</div>

</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const picked = this.state && this.state.reps;
const reps = [6, 7, 8, 9, 10, 12].map((n) => {
const on = n === picked;
return { label: String(n), checked: on ? 'true' : 'false', bg: on ? '#2B64F0' : '#1B1F26', border: on ? '1px solid #2B64F0' : '1px solid #262B33', color: on ? '#FFFFFF' : '#F4F6F8', pick: () => this.setState({ reps: n }) };
});
const missing = !picked;
return {
reps, missing, missingStr: missing ? 'true' : 'false',
repsText: missing ? '?' : String(picked),
repsColor: missing ? '#F5A524' : '#F4F6F8',
repsBg: missing ? 'rgba(245,165,36,0.10)' : '#1B1F26',
repsBorder: missing ? '1px solid #F5A524' : '1px solid #262B33',
saveBg: missing ? '#1B1F26' : '#2B64F0', saveColor: missing ? '#8B94A3' : '#FFFFFF'
};
}
}
</script>
</body>
</html>
